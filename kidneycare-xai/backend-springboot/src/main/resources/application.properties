# ============================================
# KidneyCare-XAI — Application Properties
# ============================================

spring.application.name=kidneycare-xai

# ── Database (Supabase Cloud PostgreSQL 17) ──
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.vavlhunhushdnaqdjyjy}
spring.datasource.password=${DB_PASSWORD:Kidneyprojectmca1}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool (Optimized for Supabase Pool Limits) ──
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT (Supabase JWT Secret) ──
jwt.secret=${JWT_SECRET:XGg7sWWYpmxIatIpSOtXNsI3fytG8O2UgYpxRRlLdR8=}
jwt.expiration-ms=86400000

# ── ML Service ──
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-ms=10000

# ── Server ──
server.port=8080

# ── Logging ──
logging.level.com.kidneycare=DEBUG
logging.level.org.hibernate.SQL=WARN
