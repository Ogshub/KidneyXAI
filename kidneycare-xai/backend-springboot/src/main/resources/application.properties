# ============================================
# KidneyCare-XAI — Application Properties
# ============================================

spring.application.name=kidneycare-xai

# ── Database (Supabase Cloud PostgreSQL 17 - Transaction Pooler) ──
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.vavlhunhushdnaqdjyjy}
spring.datasource.password=${DB_PASSWORD:Kidneyprojectmca1}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool (Optimized for Speed) ──
# Increased pool size from 3 → 6 to handle concurrent requests without queuing
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:6}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=8000
# Keep connections alive: prevents Supabase from closing idle connections
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# Cache: reduce repeated DB lookups
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# ── JWT (Supabase JWT Secret) ──
jwt.secret=${JWT_SECRET:XGg7sWWYpmxIatIpSOtXNsI3fytG8O2UgYpxRRlLdR8=}
jwt.expiration-ms=86400000

# ── ML Service ──
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
# Increased timeout from 10s → 30s to handle SHAP computation + cold starts
ml.service.timeout-ms=30000

# ── Server ──
server.port=${PORT:8080}
# Compression: speeds up JSON response transfer
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# ── Logging ──
logging.level.com.kidneycare=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
