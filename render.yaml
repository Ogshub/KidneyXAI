services:
  # Python ML Microservice (FastAPI + XGBoost + TreeSHAP)
  - type: web
    name: kidneycare-ml-service
    runtime: python
    rootDir: kidneycare-xai/ml-service
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # Spring Boot Backend REST API
  - type: web
    name: kidneycare-backend
    runtime: docker
    rootDir: kidneycare-xai/backend-springboot
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      - key: DB_USERNAME
        value: postgres.vavlhunhushdnaqdjyjy
